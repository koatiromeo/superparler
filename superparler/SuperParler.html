<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperParler — Quiet Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   SuperParler — « Quiet Tool » design tokens
   Dark-first. Light theme derived via [data-theme="light"].
   ============================================================ */
:root {
  --bg-base:      #0B0B0F;
  --bg-surface:   #141419;
  --bg-elevated:  #1C1C24;
  --bg-overlay:   rgba(20,20,25,0.82);
  --border-subtle: #26262F;
  --border-strong: #33333E;
  --text-primary:   #F5F5F7;
  --text-secondary: #A0A0AB;
  --text-tertiary:  #6C6C78;
  --text-on-accent: #FFFFFF;
  --accent:       #6D5EF8;
  --accent-hover: #5B4CE6;
  --accent-soft:  rgba(109,94,248,0.14);
  --accent-ring:  rgba(109,94,248,0.45);
  --live:       #FF5C7A;
  --live-soft:  rgba(255,92,122,0.16);
  --live-glow:  rgba(255,92,122,0.50);
  --success: #34D399;
  --success-soft: rgba(52,211,153,0.15);
  --warning: #FBBF24;
  --error:   #F87171;
  --error-soft: rgba(248,113,113,0.14);
  --grad-voice: linear-gradient(90deg, #6D5EF8 0%, #FF5C7A 100%);
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 999px;
  --sh-card: 0 8px 24px rgba(0,0,0,.45);
  --sh-pop:  0 12px 40px rgba(0,0,0,.55);
  --sh-focus: 0 0 0 3px var(--accent-ring);
  --sh-live: 0 0 28px var(--live-glow);
  --font-sans: 'Geist', -apple-system, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}
[data-theme="light"] {
  --bg-base:      #FAFAFB;
  --bg-surface:   #FFFFFF;
  --bg-elevated:  #F2F2F5;
  --bg-overlay:   rgba(255,255,255,0.78);
  --border-subtle: #E6E6EB;
  --border-strong: #D5D5DD;
  --text-primary:   #18181B;
  --text-secondary: #52525B;
  --text-tertiary:  #9A9AA5;
  --accent-soft:  rgba(109,94,248,0.12);
  --live-soft:    rgba(255,92,122,0.12);
  --success-soft: rgba(52,211,153,0.14);
  --error-soft:   rgba(248,113,113,0.12);
  --sh-card: 0 8px 24px rgba(20,20,30,.10);
  --sh-pop:  0 12px 40px rgba(20,20,30,.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body { background: #050507; color: var(--text-primary); overflow: hidden; }
button { font-family: inherit; }
::selection { background: var(--accent-soft); }
.qt-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.qt-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
.qt-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); background-clip: content-box; }
.qt-scroll::-webkit-scrollbar-track { background: transparent; }
.qt-nav[data-active="false"]:hover { background: var(--bg-elevated) !important; }
#root { width: 100%; height: 100%; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: #050507; color: #6C6C78; font-family: 'Geist', sans-serif; font-size: 13px; z-index: 1; }

@keyframes qt-pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,92,122,0.0), var(--sh-live); transform: scale(1); }
  50%      { box-shadow: 0 0 0 6px rgba(255,92,122,0.0), 0 0 36px var(--live-glow); transform: scale(1.05); }
}
@keyframes qt-dot-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .45; transform: scale(.82); }
}
@keyframes qt-spin { to { transform: rotate(360deg); } }
@keyframes qt-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes qt-rise {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes qt-pop-in {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes qt-hud-in {
  from { opacity: 0; transform: translate(-50%, 16px) scale(.94); }
  to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
@keyframes qt-toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(16px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">Chargement de SuperParler…</div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>

  <script>window.addEventListener('load', () => { const b = document.getElementById('boot'); if (b) setTimeout(() => b.remove(), 400); });</script>

  <!-- ═══════════════════════════ COMPONENTS ═══════════════════════════ -->
  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function Icon({ name, size = 18, stroke = 1.75, className = "", style = {} }) {
  const lib = (window.lucide && window.lucide.icons) || {};
  const data = lib[name];
  let nodes = [];
  if (Array.isArray(data)) {
    if (Array.isArray(data[2])) nodes = data[2];
    else if (data.length && Array.isArray(data[0])) nodes = data;
  } else if (data && Array.isArray(data.iconNode)) {
    nodes = data.iconNode;
  }
  const children = nodes.map((n, i) => React.createElement(n[0], { key: i, ...n[1] }));
  return React.createElement("svg", {
    width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", strokeWidth: stroke, strokeLinecap: "round",
    strokeLinejoin: "round", className, style: { flexShrink: 0, display: "block", ...style },
    "aria-hidden": true,
  }, children);
}

function Button({ variant = "primary", size = "md", icon, iconRight, children, onClick, disabled, style = {}, title }) {
  const [press, setPress] = useState(false);
  const [hover, setHover] = useState(false);
  const base = {
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    gap: 8, height: size === "sm" ? 30 : 36, padding: size === "sm" ? "0 12px" : "0 16px",
    borderRadius: "var(--r-sm)", fontFamily: "var(--font-sans)", fontWeight: 500,
    fontSize: size === "sm" ? 13 : 14, lineHeight: 1, cursor: disabled ? "default" : "pointer",
    border: "1px solid transparent", transition: "all 150ms var(--ease)", whiteSpace: "nowrap",
    transform: press ? "scale(.98)" : "scale(1)", opacity: disabled ? 0.45 : 1,
    userSelect: "none",
  };
  const variants = {
    primary: { background: "var(--accent)", color: "var(--text-on-accent)" },
    secondary: { background: "transparent", color: "var(--text-primary)", borderColor: "var(--border-subtle)" },
    ghost: { background: "transparent", color: "var(--text-secondary)" },
    danger: { background: "transparent", color: "var(--error)" },
    success: { background: "var(--success-soft)", color: "var(--success)" },
  };
  const hoverStyle = !disabled && hover ? {
    primary: { background: "var(--accent-hover)" },
    secondary: { background: "var(--bg-elevated)" },
    ghost: { background: "var(--bg-elevated)", color: "var(--text-primary)" },
    danger: { background: "var(--error-soft)" },
    success: { background: "var(--success-soft)" },
  }[variant] : {};
  return (
    <button title={title} onClick={disabled ? undefined : onClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => { setHover(false); setPress(false); }}
      onMouseDown={() => setPress(true)} onMouseUp={() => setPress(false)}
      style={{ ...base, ...variants[variant], ...hoverStyle, ...style }}>
      {icon && <Icon name={icon} size={size === "sm" ? 15 : 16} stroke={1.9} />}
      {children}
      {iconRight && <Icon name={iconRight} size={size === "sm" ? 15 : 16} stroke={1.9} />}
    </button>
  );
}

function Toggle({ checked, onChange, disabled }) {
  return (
    <button role="switch" aria-checked={checked} disabled={disabled}
      onClick={() => !disabled && onChange(!checked)}
      style={{
        width: 40, height: 22, borderRadius: 999, border: "1px solid",
        borderColor: checked ? "transparent" : "var(--border-strong)",
        background: checked ? "var(--accent)" : "var(--bg-elevated)",
        position: "relative", cursor: disabled ? "default" : "pointer",
        transition: "all 160ms var(--ease)", padding: 0, flexShrink: 0, opacity: disabled ? .5 : 1,
      }}>
      <span style={{
        position: "absolute", top: 2, left: checked ? 19 : 2, width: 16, height: 16,
        borderRadius: 999, background: "#fff", boxShadow: "0 1px 2px rgba(0,0,0,.4)",
        transition: "left 160ms var(--ease)",
      }} />
    </button>
  );
}

function Segmented({ options, value, onChange, size = "md", full }) {
  return (
    <div style={{
      display: "inline-flex", padding: 3, gap: 2, background: "var(--bg-elevated)",
      borderRadius: "var(--r-sm)", border: "1px solid var(--border-subtle)",
      width: full ? "100%" : "auto",
    }}>
      {options.map((o) => {
        const v = typeof o === "string" ? o : o.value;
        const label = typeof o === "string" ? o : o.label;
        const active = v === value;
        return (
          <button key={v} onClick={() => onChange(v)} style={{
            flex: full ? 1 : "0 0 auto", display: "inline-flex", alignItems: "center",
            justifyContent: "center", gap: 6,
            height: size === "sm" ? 26 : 30, padding: "0 14px", border: "none",
            borderRadius: 6, cursor: "pointer", fontSize: 13, fontWeight: 500,
            fontFamily: "var(--font-sans)", whiteSpace: "nowrap",
            background: active ? "var(--bg-surface)" : "transparent",
            color: active ? "var(--text-primary)" : "var(--text-secondary)",
            boxShadow: active ? "0 1px 3px rgba(0,0,0,.35)" : "none",
            transition: "all 150ms var(--ease)",
          }}>
            {typeof o === "object" && o.icon && <Icon name={o.icon} size={14} stroke={1.9} />}
            {label}
          </button>
        );
      })}
    </div>
  );
}

function Select({ value, options, onChange, width }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const current = options.find((o) => (o.value ?? o) === value);
  const label = current ? (current.label ?? current) : value;
  return (
    <div ref={ref} style={{ position: "relative", width: width || "auto" }}>
      <button onClick={() => setOpen(!open)} style={{
        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
        width: "100%", height: 36, padding: "0 12px", background: "var(--bg-elevated)",
        border: "1px solid", borderColor: open ? "var(--accent)" : "var(--border-subtle)",
        boxShadow: open ? "var(--sh-focus)" : "none",
        borderRadius: "var(--r-sm)", color: "var(--text-primary)", fontSize: 14,
        fontFamily: "var(--font-sans)", cursor: "pointer", transition: "all 150ms var(--ease)",
      }}>
        <span>{label}</span>
        <Icon name="ChevronDown" size={16} stroke={2} style={{ color: "var(--text-tertiary)", transition: "transform 150ms", transform: open ? "rotate(180deg)" : "none" }} />
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, zIndex: 50,
          background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
          borderRadius: "var(--r-sm)", boxShadow: "var(--sh-pop)", padding: 4,
          animation: "qt-pop-in 140ms var(--ease)",
        }}>
          {options.map((o) => {
            const v = o.value ?? o; const l = o.label ?? o;
            const active = v === value;
            return (
              <button key={v} onClick={() => { onChange(v); setOpen(false); }} style={{
                display: "flex", alignItems: "center", justifyContent: "space-between",
                width: "100%", height: 32, padding: "0 10px", border: "none",
                borderRadius: 6, background: active ? "var(--accent-soft)" : "transparent",
                color: active ? "var(--text-primary)" : "var(--text-secondary)",
                fontSize: 14, fontFamily: "var(--font-sans)", cursor: "pointer", textAlign: "left",
              }}
                onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--bg-elevated)"; }}
                onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                {l}
                {active && <Icon name="Check" size={15} stroke={2.2} style={{ color: "var(--accent)" }} />}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function TextInput({ value, onChange, placeholder, mono, password, icon, width, onReveal }) {
  const [focus, setFocus] = useState(false);
  const [reveal, setReveal] = useState(false);
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 8, height: 36, width: width || "100%",
      padding: "0 10px", background: "var(--bg-elevated)", border: "1px solid",
      borderColor: focus ? "var(--accent)" : "var(--border-subtle)",
      boxShadow: focus ? "var(--sh-focus)" : "none",
      borderRadius: "var(--r-sm)", transition: "all 150ms var(--ease)",
    }}>
      {icon && <Icon name={icon} size={15} style={{ color: "var(--text-tertiary)" }} />}
      <input value={value} onChange={(e) => onChange && onChange(e.target.value)}
        placeholder={placeholder} type={password && !reveal ? "password" : "text"}
        onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
        style={{
          flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none",
          color: "var(--text-primary)", fontSize: 14,
          fontFamily: mono ? "var(--font-mono)" : "var(--font-sans)",
          letterSpacing: password && !reveal ? "0.12em" : "normal",
        }} />
      {password && (
        <button onClick={() => setReveal(!reveal)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-tertiary)", display: "flex", padding: 2 }}>
          <Icon name={reveal ? "EyeOff" : "Eye"} size={15} />
        </button>
      )}
    </div>
  );
}

function Keycap({ children, wide }) {
  return (
    <kbd style={{
      display: "inline-flex", alignItems: "center", justifyContent: "center",
      minWidth: wide ? 56 : 24, height: 26, padding: "0 8px",
      background: "var(--bg-elevated)", border: "1px solid var(--border-strong)",
      borderBottomWidth: 2, borderRadius: 6, color: "var(--text-primary)",
      fontFamily: "var(--font-mono)", fontSize: 12, fontWeight: 500,
      boxShadow: "0 1px 0 rgba(0,0,0,.3)",
    }}>{children}</kbd>
  );
}

function HotkeyCapture({ keys = ["⌘", "⇧", "Espace"], onCapture }) {
  const [capturing, setCapturing] = useState(false);
  return (
    <button onClick={() => { setCapturing(true); setTimeout(() => setCapturing(false), 1800); }}
      style={{
        display: "flex", alignItems: "center", gap: 8, height: 44, padding: "0 12px",
        width: "100%", background: "var(--bg-elevated)", border: "1px solid",
        borderColor: capturing ? "var(--accent)" : "var(--border-subtle)",
        boxShadow: capturing ? "var(--sh-focus)" : "none",
        borderRadius: "var(--r-sm)", cursor: "pointer", transition: "all 150ms var(--ease)",
        animation: capturing ? "qt-dot-pulse 1.2s ease-in-out infinite" : "none",
      }}>
      {capturing ? (
        <span style={{ color: "var(--text-secondary)", fontSize: 14 }}>Appuyez sur une combinaison…</span>
      ) : (
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          {keys.map((k, i) => <Keycap key={i} wide={k.length > 2}>{k}</Keycap>)}
        </span>
      )}
      <span style={{ flex: 1 }} />
      <Icon name="Keyboard" size={16} style={{ color: "var(--text-tertiary)" }} />
    </button>
  );
}

function Badge({ variant = "neutral", icon, children }) {
  const styles = {
    neutral: { background: "transparent", border: "1px solid var(--border-subtle)", color: "var(--text-secondary)" },
    accent: { background: "var(--accent-soft)", border: "1px solid transparent", color: "var(--accent)" },
    success: { background: "var(--success-soft)", border: "1px solid transparent", color: "var(--success)" },
    live: { background: "var(--live-soft)", border: "1px solid transparent", color: "var(--live)" },
  };
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 4, height: 20, padding: "0 8px",
      borderRadius: 999, fontSize: 11, fontWeight: 600, letterSpacing: "0.02em",
      fontFamily: "var(--font-sans)", ...styles[variant],
    }}>
      {icon && <Icon name={icon} size={11} stroke={2.2} />}
      {children}
    </span>
  );
}

function StatusDot({ state = "idle", size = 8 }) {
  const map = {
    idle: { c: "var(--text-tertiary)", pulse: false },
    recording: { c: "var(--live)", pulse: true },
    transcribing: { c: "var(--accent)", pulse: true },
    success: { c: "var(--success)", pulse: false },
    error: { c: "var(--error)", pulse: false },
  };
  const s = map[state] || map.idle;
  return (
    <span style={{
      width: size, height: size, borderRadius: 999, background: s.c, flexShrink: 0,
      boxShadow: s.pulse ? `0 0 8px ${s.c}` : "none",
      animation: s.pulse ? "qt-dot-pulse 1.2s ease-in-out infinite" : "none",
    }} />
  );
}

function Card({ title, desc, right, children, style = {}, pad = 20 }) {
  return (
    <section style={{
      background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
      borderRadius: "var(--r-md)", padding: pad, ...style,
    }}>
      {(title || right) && (
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16, marginBottom: desc ? 4 : 16 }}>
          <div>
            {title && <h2 style={{ margin: 0, fontSize: 18, lineHeight: "26px", fontWeight: 600, color: "var(--text-primary)" }}>{title}</h2>}
          </div>
          {right}
        </div>
      )}
      {desc && <p style={{ margin: "0 0 16px", fontSize: 13, lineHeight: "18px", color: "var(--text-secondary)", maxWidth: 520 }}>{desc}</p>}
      {children}
    </section>
  );
}

function Waveform({ bars = 26, active = true, style: wStyle = "bars", height = 40, frozen = false, color }) {
  const [levels, setLevels] = useState(() => Array.from({ length: bars }, () => 0.25));
  const raf = useRef(0); const t = useRef(0);
  useEffect(() => {
    if (!active || frozen) { setLevels(Array.from({ length: bars }, () => 0.18)); return; }
    const tick = () => {
      t.current += 0.18;
      setLevels(Array.from({ length: bars }, (_, i) => {
        const c = (bars - 1) / 2;
        const env = 1 - Math.abs(i - c) / (c + 2) * 0.55;
        const n = (Math.sin(t.current + i * 0.7) * 0.5 + 0.5) * 0.5
                + (Math.sin(t.current * 1.7 + i * 1.3) * 0.5 + 0.5) * 0.3
                + Math.random() * 0.25;
        return Math.max(0.08, Math.min(1, n * env));
      }));
      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [active, frozen, bars]);

  const fill = color || "var(--grad-voice)";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: wStyle === "dots" ? 4 : 3, height, justifyContent: "center" }}>
      {levels.map((l, i) => wStyle === "dots" ? (
        <span key={i} style={{
          width: 5, height: 5, borderRadius: 999,
          background: frozen ? "var(--border-strong)" : fill,
          opacity: frozen ? 1 : 0.4 + l * 0.6,
          transform: `translateY(${(0.5 - l) * height * 0.5}px)`,
          transition: "transform 90ms linear, opacity 90ms linear",
        }} />
      ) : (
        <span key={i} style={{
          width: 3, borderRadius: 999,
          height: Math.max(3, l * height),
          background: frozen ? "var(--border-strong)" : fill,
          backgroundSize: `${bars * 6}px 100%`,
          backgroundPosition: `${-i * 6}px 0`,
          transition: "height 90ms linear",
        }} />
      ))}
    </div>
  );
}

function Wordmark({ size = 20, mark = true }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 9 }}>
      {mark && (
        <span style={{ display: "inline-flex", alignItems: "flex-end", gap: 2.5, height: size * 0.9 }}>
          {[0.5, 1, 0.7].map((h, i) => (
            <span key={i} style={{ width: 3, height: size * 0.9 * h, borderRadius: 999, background: "var(--grad-voice)" }} />
          ))}
        </span>
      )}
      <span style={{ fontSize: size, fontWeight: 700, letterSpacing: "-0.02em", color: "var(--text-primary)" }}>SuperParler</span>
    </span>
  );
}

Object.assign(window, { Icon, Button, Toggle, Segmented, Select, TextInput, Keycap, HotkeyCapture, Badge, StatusDot, Card, Waveform, Wordmark });
  </script>

  <!-- ═══════════════════════════ HUD ═══════════════════════════ -->
  <script type="text/babel">
function HUD({ state, elapsed = 0, pastedText = "", errorMsg = "Micro indisponible", shape = "pill", waveStyle = "bars", holdHint = "Relâchez ⌘⇧Espace pour transcrire" }) {
  const radius = shape === "card" ? 16 : 999;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const shell = {

  <script type="text/babel">
function TrayMenu({ state = "idle", onStart, onStop, onHistory, onSettings, onQuit, engine = "Local · Small" }) {
  const header = { idle: { dot: "idle", label: "SuperParler — Prêt" }, recording: { dot: "recording", label: "Enregistrement…" }, transcribing: { dot: "transcribing", label: "Transcription…" } }[state] || { dot: "idle", label: "SuperParler — Prêt" };

      </div>
      <TrayItem icon={recording ? "Square" : "Mic"} label={recording ? "Arrêter la dictée" : "Démarrer la dictée"} shortcut="⌘⇧Espace" onClick={recording ? onStop : onStart} accent={recording} />

      <TrayDivider />
      <TrayItem icon="Power" label="Quitter" onClick={onQuit} />
    </div>
  );
}

function TrayDivider() { return <div style={{ height: 1, background: "var(--border-subtle)", margin: "5px 8px" }} />; }

function TrayItem({ icon, label, shortcut, onClick, accent }) {
  const [h, setH] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", height: 34, padding: "0 10px", border: "none", borderRadius: 7, cursor: "pointer", textAlign: "left", background: h ? "var(--accent-soft)" : "transparent", color: h ? "var(--text-primary)" : (accent ? "var(--live)" : "var(--text-secondary)"), transition: "background 120ms var(--ease)", fontFamily: "var(--font-sans)" }}>

}

function TrayGlyph({ state = "idle", size = 17 }) {
  if (state === "transcribing") {
    return (
      <span style={{ display: "inline-flex", gap: 2.5, alignItems: "center", height: size }}>
        {[0, 1, 2].map((i) => <span key={i} style={{ width: 3.5, height: 3.5, borderRadius: 999, background: "var(--accent)", animation: "qt-dot-pulse 1s ease-in-out infinite", animationDelay: `${i * 0.18}s` }} />)}

  return (
    <span style={{ position: "relative", display: "inline-flex" }}>
      <Icon name="Mic" size={size} stroke={recording ? 0 : 1.9} style={{ color: recording ? "var(--live)" : "var(--text-secondary)", fill: recording ? "var(--live)" : "none" }} />

}

Object.assign(window, { TrayMenu, TrayGlyph });

const SEED_HISTORY = [

function HistoryView({ store, set, embedded, onToast }) {
  const [items, setItems] = useState(SEED_HISTORY);
  const [query, setQuery] = useState("");
  const filtered = items.filter((i) => i.text.toLowerCase().includes(query.toLowerCase()));
  const days = [...new Set(filtered.map((i) => i.day))];
  const remove = (id) => setItems((xs) => xs.filter((x) => x.id !== id));
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18 }}>
        {!embedded && <h1 style={{ margin: 0, fontSize: 24, lineHeight: "32px", fontWeight: 700, flexShrink: 0 }}>Historique</h1>}
        <div style={{ flex: 1, maxWidth: embedded ? "none" : 320 }}>
          <TextInput icon="Search" value={query} onChange={setQuery} placeholder="Rechercher…" />
        </div>
        <span style={{ flex: embedded ? 1 : 0 }} />
        <Button variant="danger" size="sm" icon="Trash2" onClick={() => setItems([])}>Tout effacer</Button>
      </div>
      {filtered.length === 0 ? (
        <EmptyHistory cleared={items.length === 0 && query === ""} query={query} />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
          {days.map((day) => (
            <div key={day}>
              <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase", color: "var(--text-tertiary)", marginBottom: 8, paddingLeft: 2 }}>{day}</div>

                {filtered.filter((i) => i.day === day).map((it) => (
                  <HistoryItem key={it.id} it={it} onCopy={() => onToast && onToast("Copié")} onRemove={() => remove(it.id)} />
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function HistoryItem({ it, onCopy, onRemove }) {
  const [h, setH] = useState(false);
  return (
    <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{ position: "relative", padding: "14px 16px", borderRadius: "var(--r-md)", background: h ? "var(--bg-elevated)" : "var(--bg-surface)", border: "1px solid var(--border-subtle)", transition: "background 130ms var(--ease)" }}>
      <p style={{ margin: "0 0 10px", fontSize: 14, lineHeight: "20px", color: "var(--text-primary)", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden", paddingRight: h ? 76 : 0, transition: "padding 130ms var(--ease)" }}>{it.text}</p>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--text-tertiary)" }}>{it.ago}</span>
        <span style={{ width: 3, height: 3, borderRadius: 999, background: "var(--border-strong)" }} />
        <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--text-tertiary)" }}><Icon name="Clock" size={12} /> {it.dur}</span>
        <Badge variant={it.engine === "Groq" ? "accent" : "neutral"} icon={it.engine === "Groq" ? "Cloud" : "Cpu"}>{it.engine}</Badge>
        {it.reform && <Badge variant="success" icon="Sparkles">Reformulé</Badge>}
      </div>
      <div style={{ position: "absolute", top: 12, right: 12, display: "flex", gap: 4, opacity: h ? 1 : 0, transform: h ? "none" : "translateY(-2px)", transition: "all 130ms var(--ease)", pointerEvents: h ? "auto" : "none" }}>
        <IconBtn icon="Copy" title="Copier" onClick={onCopy} />
        <IconBtn icon="Trash2" title="Supprimer" danger onClick={onRemove} />
      </div>
    </div>
  );
}

function IconBtn({ icon, title, danger, onClick }) {
  const [h, setH] = useState(false);
  return (
    <button title={title} onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{ display: "grid", placeItems: "center", width: 30, height: 30, borderRadius: 7, cursor: "pointer", border: "1px solid var(--border-subtle)", background: h ? (danger ? "var(--error-soft)" : "var(--bg-surface)") : "var(--bg-elevated)", color: h && danger ? "var(--error)" : "var(--text-secondary)", transition: "all 120ms var(--ease)" }}>
      <Icon name={icon} size={15} />

}

function EmptyHistory({ cleared, query }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "72px 0", gap: 14 }}>
      <span style={{ width: 56, height: 56, borderRadius: 999, display: "grid", placeItems: "center", background: "var(--bg-elevated)", border: "1px solid var(--border-subtle)", color: "var(--text-tertiary)" }}><Icon name={query ? "Search" : "Mic"} size={24} /></span>

        </div>
      )}
    </div>
  );
}

Object.assign(window, { HistoryView });

  <script type="text/babel">
function Onboarding({ onFinish, onSkip }) {
  const [step, setStep] = useState(0);
  const [micGranted, setMicGranted] = useState(false);
  const [a11yGranted, setA11yGranted] = useState(false);
  const [engine, setEngine] = useState("local");
  const [model, setModel] = useState("small");
  const [hotkeyMode, setHotkeyMode] = useState("hold");
  const next = () => setStep((s) => Math.min(3, s + 1));
  return (
    <div style={{ width: 720, height: 560, position: "relative", display: "flex", flexDirection: "column", background: "var(--bg-base)", border: "1px solid var(--border-strong)", borderRadius: "var(--r-lg)", boxShadow: "0 32px 90px rgba(0,0,0,.6)", overflow: "hidden" }}>
      <button onClick={onSkip} style={{ position: "absolute", top: 18, right: 20, zIndex: 5, background: "none", border: "none", color: "var(--text-tertiary)", fontSize: 13, cursor: "pointer", fontFamily: "var(--font-sans)" }}>Passer</button>
      <div key={step} style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 56px", animation: "qt-rise 320ms var(--ease)" }}>
        {step === 0 && <StepWelcome onNext={next} />}
        {step === 1 && <StepPerms micGranted={micGranted} setMic={setMicGranted} a11yGranted={a11yGranted} setA11y={setA11yGranted} onNext={next} />}
        {step === 2 && <StepEngine engine={engine} setEngine={setEngine} model={model} setModel={setModel} onNext={next} />}
        {step === 3 && <StepHotkey hotkeyMode={hotkeyMode} setHotkeyMode={setHotkeyMode} onFinish={onFinish} />}
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 8, paddingBottom: 26 }}>
        {[0, 1, 2, 3].map((i) => (<span key={i} style={{ width: i === step ? 22 : 7, height: 7, borderRadius: 999, background: i === step ? "var(--accent)" : "var(--border-strong)", transition: "all 220ms var(--ease)" }} />))}
      </div>
    </div>
  );
}

function StepWelcome({ onNext }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: 18 }}>
      <Wordmark size={34} />

}

function StepHeader({ title, desc }) {

    <div style={{ marginBottom: 24 }}>

}

function PermCard({ icon, title, desc, granted, onGrant }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, padding: 16, background: "var(--bg-surface)", border: "1px solid", borderColor: granted ? "var(--success)" : "var(--border-subtle)", borderRadius: "var(--r-md)", transition: "border-color 160ms var(--ease)" }}>

}

function StepPerms({ micGranted, setMic, a11yGranted, setA11y, onNext }) {

function OnbModelCard({ name, size, badge, selected, onClick }) {

    <button onClick={onClick} style={{ flex: 1, textAlign: "left", padding: 14, borderRadius: "var(--r-sm)", cursor: "pointer", background: selected ? "var(--accent-soft)" : "var(--bg-surface)", border: "1px solid", borderColor: selected ? "var(--accent)" : "var(--border-subtle)", transition: "all 140ms var(--ease)" }}>

      {badge && <Badge variant={badge.variant}>{badge.label}</Badge>}

}

function StepEngine({ engine, setEngine, model, setModel, onNext }) {

    <div>
      <StepHeader title="Moteur de transcription" desc="Vous pourrez en changer à tout moment." />

      <div style={{ marginTop: 16, minHeight: 132 }}>
        {engine === "local" ? (

            </div>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, marginTop: 14, fontSize: 12.5, color: "var(--text-tertiary)" }}><Icon name="WifiOff" size={13} /> Fonctionne hors-ligne, privé.</div>
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--text-tertiary)", marginBottom: 8 }}>Clé API</div>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <TextInput password mono placeholder="gsk_••••••••••••••••" value="" onChange={() => {}} />
                <a href="#" onClick={(e) => e.preventDefault()} style={{ fontSize: 13, color: "var(--accent)", whiteSpace: "nowrap", textDecoration: "none" }}>Obtenir une clé</a>

          </div>

      <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 18 }}>
        <Button onClick={onNext} iconRight="ArrowRight">Continuer</Button>

function StepHotkey({ hotkeyMode, setHotkeyMode, onFinish }) {

              <span style={{ width: 44, flexShrink: 0, textAlign: "right", paddingRight: 16, color: "#3A3A46", userSelect: "none" }}>{i + 1}</span>
              <span style={{ whiteSpace: "pre" }}>
                {line.map((t, j) => { if (t[0] === "sp") return " "; if (t[0] === "in") return "  "; return <span key={j} style={{ color: TOK[t[0]] || "#F5F5F7" }}>{t[1]}</span>; })}
              </span>
            </div>
          ))}
        </pre>
      </div>
      <div style={{ height: 24, flexShrink: 0, display: "flex", alignItems: "center", gap: 14, padding: "0 14px", background: "rgba(109,94,248,0.10)", borderTop: "1px solid rgba(255,255,255,0.05)", fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--text-tertiary)" }}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><Icon name="GitBranch" size={12} /> main</span>
        <span style={{ flex: 1 }} />
        <span>TypeScript</span><span>UTF-8</span><span>Ln 6, Col 24</span>
      </div>
    </div>
  );
}

Object.assign(window, { MenuBar, CodeEditor });
  </script>

  <!-- ═══════════════════════════ APP ═══════════════════════════ -->
  <script type="text/babel">
const DEFAULT_STORE = {
  engine: "local", model: "small", apiKey: "", groqModel: "whisper-large-v3-turbo",
  lang: "fr", launchOnStart: true, inject: "paste", hotkeyMode: "hold", enhance: true,
  enhancePrompt: "Corrige l'orthographe et la ponctuation, garde un ton naturel.",
  theme: "dark", sound: true, showHud: true,
};
const PASTED_TEXT = "Peux-tu confirmer le créneau de jeudi 14 h pour l'atelier design…";

function useClock() {
  const [t, setT] = useState("");
  useEffect(() => {
    const fmt = () => new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    setT(fmt());
    const id = setInterval(() => setT(fmt()), 10000);
    return () => clearInterval(id);
  }, []);
  return t;
}

function App() {
  const [store, setStore] = useState(() => {
    try { return { ...DEFAULT_STORE, ...JSON.parse(localStorage.getItem("sp_store") || "{}") }; }
    catch { return DEFAULT_STORE; }
  });
  const set = useCallback((patch) => setStore((s) => { const n = { ...s, ...patch }; localStorage.setItem("sp_store", JSON.stringify(n)); return n; }), []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", store.theme);
  }, [store.theme]);

  const [showOnb, setShowOnb] = useState(() => localStorage.getItem("sp_onboarded") !== "1");
  const finishOnb = () => { localStorage.setItem("sp_onboarded", "1"); setShowOnb(false); };

  const [settingsOpen, setSettingsOpen] = useState(false);
  const [nav, setNav] = useState("engine");
  const [trayOpen, setTrayOpen] = useState(false);

  const [rec, setRec] = useState("idle");
  const [elapsed, setElapsed] = useState(0);
  const timers = useRef([]);
  const elapsedRef = useRef(null);
  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };

  const startRec = useCallback(() => {
    clearTimers(); setTrayOpen(false); setRec("recording"); setElapsed(0);
    clearInterval(elapsedRef.current);
    elapsedRef.current = setInterval(() => setElapsed((e) => e + 1), 1000);
  }, []);

  const stopRec = useCallback(() => {
    clearInterval(elapsedRef.current);
    setRec("transcribing");
    timers.current.push(setTimeout(() => setRec("pasted"), 1500));
    timers.current.push(setTimeout(() => { setRec("idle"); showToast("Texte collé"); }, 3100));
  }, []);

  const triggerError = useCallback(() => {
    clearTimers(); clearInterval(elapsedRef.current); setTrayOpen(false); setRec("error");
    timers.current.push(setTimeout(() => setRec("idle"), 2400));
  }, []);

  const trayState = rec === "recording" ? "recording" : rec === "transcribing" ? "transcribing" : "idle";

  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.code === "Space" || e.key === " ")) {
        e.preventDefault();
        setRec((r) => { if (r === "idle") { startRec(); return "recording"; } if (r === "recording") { stopRec(); return r; } return r; });
      }
      if (e.key === "Escape") { setTrayOpen(false); setSettingsOpen(false); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [startRec, stopRec]);

  const [toastMsg, setToastMsg] = useState(null);
  const toastTimer = useRef(null);
  const showToast = useCallback((msg) => {
    setToastMsg(msg); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2500);
  }, []);

  const W = 1440, H = 900;
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const fit = () => setScale(Math.min(window.innerWidth / W, window.innerHeight / H));
    fit(); window.addEventListener("resize", fit); return () => window.removeEventListener("resize", fit);
  }, []);
  const clock = useClock();
  const openSettings = (section) => { setNav(section || "engine"); setSettingsOpen(true); setTrayOpen(false); };

  return (
    <div style={{ width: "100vw", height: "100vh", background: "#050507", display: "grid", placeItems: "center", overflow: "hidden" }}>
      <div style={{ width: W, height: H, transform: `scale(${scale})`, transformOrigin: "center", position: "relative", flexShrink: 0 }}>
        {/* wallpaper */}
        <div style={{ position: "absolute", inset: 0, background: "radial-gradient(120% 90% at 50% 0%, #16121f 0%, #0a0a0e 55%, #060608 100%)" }} />
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column" }}>
          <MenuBar trayState={trayState} trayOpen={trayOpen} onTrayClick={() => setTrayOpen((o) => !o)} clock={clock} />
          <div style={{ flex: 1, position: "relative" }}><CodeEditor /></div>
        </div>

        {/* tray dropdown */}
        {trayOpen && (
          <div style={{ position: "absolute", top: 32, right: 96, zIndex: 70 }}>
            <TrayMenu state={trayState} engine={store.engine === "groq" ? "Groq · connecté" : "Local · Small"}
              onStart={startRec} onStop={stopRec}
              onHistory={() => openSettings("history")} onSettings={() => openSettings("engine")}
              onQuit={() => { setTrayOpen(false); showToast("À bientôt 👋"); }} />
          </div>
        )}
        {trayOpen && <div onClick={() => setTrayOpen(false)} style={{ position: "absolute", inset: 0, zIndex: 65 }} />}

        {/* HUD */}
        {rec !== "idle" && store.showHud && (
          <div style={{ position: "absolute", left: "50%", bottom: 60, transform: "translateX(-50%)", zIndex: 80 }}>
            <HUD state={rec} elapsed={elapsed} pastedText={PASTED_TEXT}
              holdHint={store.hotkeyMode === "hold" ? "Relâchez ⌘⇧Espace pour transcrire" : "Appuyez sur ⌘⇧Espace pour arrêter"} />
            {rec === "recording" && (
              <button onClick={stopRec} style={{ position: "absolute", bottom: -34, left: "50%", transform: "translateX(-50%)", whiteSpace: "nowrap", background: "none", border: "none", color: "var(--text-tertiary)", fontSize: 12, cursor: "pointer", textDecoration: "underline", textUnderlineOffset: 3 }}>terminer la démo</button>
            )}
          </div>
        )}

        {/* Settings window */}
        {settingsOpen && (
          <WindowFrame onClose={() => setSettingsOpen(false)} z={90}>
            <Settings nav={nav} setNav={setNav} store={store} set={set} onClose={() => setSettingsOpen(false)} onReplayOnboarding={() => { setSettingsOpen(false); setShowOnb(true); }} />
          </WindowFrame>
        )}

        {/* Onboarding */}
        {showOnb && (
          <div style={{ position: "absolute", inset: 0, zIndex: 100, display: "grid", placeItems: "center", background: "rgba(4,4,8,0.55)", backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)", animation: "qt-rise 240ms var(--ease)" }}>
            <Onboarding onFinish={finishOnb} onSkip={finishOnb} />
          </div>
        )}

        {/* Toast */}
        {toastMsg && (
          <div style={{ position: "absolute", left: "50%", bottom: 28, zIndex: 110, animation: "qt-toast-in 220ms var(--ease)", display: "flex", alignItems: "center", gap: 10, padding: "10px 16px", background: "var(--bg-surface)", border: "1px solid var(--border-subtle)", borderRadius: "var(--r-md)", boxShadow: "var(--sh-pop)", transform: "translateX(-50%)" }}>
            <Icon name="Check" size={16} stroke={2.4} style={{ color: "var(--success)" }} />
            <span style={{ fontSize: 13.5, color: "var(--text-primary)" }}>{toastMsg}</span>
          </div>
        )}

        {/* Demo Dock */}
        {!showOnb && <DemoDock rec={rec} onStart={startRec} onStop={stopRec} onError={triggerError} onSettings={() => openSettings("engine")} onHistory={() => openSettings("history")} onReplay={() => setShowOnb(true)} onTray={() => setTrayOpen((o) => !o)} />}
      </div>
    </div>
  );
}

function WindowFrame({ children, onClose, z = 90 }) {
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const drag = useRef(null);
  useEffect(() => {
    const move = (e) => { if (drag.current) setPos({ x: e.clientX - drag.current.x, y: e.clientY - drag.current.y }); };
    const up = () => { drag.current = null; };
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  }, []);
  return (
    <div style={{ position: "absolute", inset: 0, zIndex: z, display: "grid", placeItems: "center" }}>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(4,4,8,0.35)" }} />
      <div style={{ position: "relative", transform: `translate(${pos.x}px, ${pos.y}px)`, animation: "qt-pop-in 200ms var(--ease)" }}>
        <div onMouseDown={(e) => { drag.current = { x: e.clientX - pos.x, y: e.clientY - pos.y }; }} style={{ position: "absolute", top: 0, left: 0, right: 0, height: 52, cursor: "grab", zIndex: 1 }} />
        {children}
      </div>
    </div>
  );
}

function DemoDock({ rec, onStart, onStop, onError, onSettings, onHistory, onReplay, onTray }) {
  const [open, setOpen] = useState(true);
  return (
    <div style={{ position: "absolute", left: 24, bottom: 24, zIndex: 95, fontFamily: "var(--font-sans)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: open ? "8px 10px" : 8, background: "var(--bg-overlay)", backdropFilter: "blur(18px)", WebkitBackdropFilter: "blur(18px)", border: "1px solid var(--border-strong)", borderRadius: "var(--r-md)", boxShadow: "var(--sh-pop)" }}>
        <button onClick={() => setOpen((o) => !o)} title="Démo" style={{ display: "grid", placeItems: "center", width: 28, height: 28, borderRadius: 7, border: "none", cursor: "pointer", background: "var(--accent-soft)", color: "var(--accent)" }}>
          <Icon name="Wand2" size={15} />
        </button>
        {open && (
          <React.Fragment>
            <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--text-tertiary)" }}>Démo</span>
            <span style={{ width: 1, height: 18, background: "var(--border-strong)" }} />
            {rec === "idle" || rec === "error"
              ? <DBtn icon="Mic" onClick={onStart}>Dicter</DBtn>
              : rec === "recording"
                ? <DBtn icon="Square" onClick={onStop} accent>Transcrire</DBtn>
                : <DBtn icon="Loader" disabled>…</DBtn>}
            <DBtn icon="TriangleAlert" onClick={onError}>Erreur</DBtn>
            <span style={{ width: 1, height: 18, background: "var(--border-strong)" }} />
            <DBtn icon="Menu" onClick={onTray}>Tray</DBtn>
            <DBtn icon="Settings" onClick={onSettings}>Réglages</DBtn>
            <DBtn icon="History" onClick={onHistory}>Historique</DBtn>
            <DBtn icon="RefreshCw" onClick={onReplay}>Intro</DBtn>
          </React.Fragment>
        )}
      </div>
      {open && <div style={{ marginTop: 6, paddingLeft: 4, fontSize: 11, color: "var(--text-tertiary)" }}>Astuce : <span style={{ fontFamily: "var(--font-mono)" }}>⌘⇧Espace</span> pour dicter</div>}
    </div>
  );
}

function DBtn({ icon, children, onClick, accent, disabled }) {
  const [h, setH] = useState(false);
  return (
    <button onClick={onClick} disabled={disabled} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{ display: "inline-flex", alignItems: "center", gap: 6, height: 28, padding: "0 10px", borderRadius: 7, border: "1px solid", borderColor: h ? "var(--border-strong)" : "transparent", background: h ? "var(--bg-elevated)" : "transparent", color: accent ? "var(--live)" : (h ? "var(--text-primary)" : "var(--text-secondary)"), fontSize: 12.5, fontWeight: 500, cursor: disabled ? "default" : "pointer", fontFamily: "var(--font-sans)", opacity: disabled ? 0.5 : 1 }}>
      <Icon name={icon} size={14} /> {children}
    </button>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
